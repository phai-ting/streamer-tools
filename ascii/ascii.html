<html lang="en-US">
<head>
<meta charset="UTF-8">
<title>ASCII Alert</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
  }
  body.preview {
    background:

      #12141a;
  }
  #screen {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    display: none;
    position: fixed;
    left: 16px;
    bottom: 14px;
    z-index: 2;
    max-width: min(760px, calc(100% - 32px));
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.62);
    color: #f4f1ea;
    font: 13px/1.4 "Segoe UI", sans-serif;
    pointer-events: none;
  }
  body.preview #hud { display: block; }
  #hud[hidden] { display: none !important; }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
</style>
</head>

    { font: "doom", color: "#ffcc33", message: "NOVA\nSUBSCRIBED" },
    { font: "slant", color: "#5ce1ff", message: "WELCOME" },
    { font: "small", color: "#ffb000", message: "THANKS FOR STOPPING BY" },
    { font: "star", color: "#c084fc", message: "GG\nFRIENDS" },
    { font: "epic", color: "#33ff66", message: "HELLO" },
    { font: "solid", color: "#ff7a18", message: "SUB" }
  ];
  var sampleIndex = 0;

  function contentFrom(start) {
    if (!current) return false;
    var buf = current.laid.buf;
    for (var y = start; y < ROWS; y++) {
      if (buf[y] && buf[y].trim()) return true;
    }
    return false;
  }

  function clearTimers() {
    clearTimeout(holdTimer);
    clearInterval(scrollTimer);
    clearTimeout(endTimer);
    holdTimer = 0;
    scrollTimer = 0;
    endTimer = 0;
  }

  function blinkOn(now) {
    return Math.floor(now / 530) % 2 === 0;
  }

  function renderHud() {
    if (!preview || !hud) return;
    var conn = "Streamer.bot connecting…";
    if (connection === "connected") conn = "Streamer.bot connected";
    else if (connection === "disconnected") conn = "Streamer.bot disconnected";
    else if (connection === "auth") conn = "Streamer.bot needs ?password=";
    else if (connection === "missing") conn = "Add ?password= or check the WebSocket server";
    else if (connection === "error") conn = "Streamer.bot connection error";
    var extra = queue.length ? " · " + queue.length + " waiting" : "";
    hud.hidden = state !== "idle";
    hud.textContent = "Click or Space for a sample · Esc dismisses · " + conn + extra;
  }

  function setConnection(next) {
    connection = next;
    renderHud();
    if (debug) console.log("Streamer.bot:", next);
  }

  function enqueue(opts) {
    if (!opts || opts.message == null || String(opts.message).trim() === "") return;
    var holdSec = opts.hold == null ? defaultHoldSec : clamp(Number(opts.hold), 0, 120);
    if (!isFinite(holdSec)) holdSec = defaultHoldSec;
    var job = {
      message: String(opts.message),
      fontName: opts.font || defaultFontName,
      color: resolveColor(opts.color || defaultColor),
      holdMs: holdSec * 1000,
      scrollMs: scrollMs
    };
    if (state === "idle" && !current && !endTimer) start(job);
    else {
      if (queue.length >= 6) queue.shift();
      queue.push(job);
      renderHud();
    }
  }

  function resolveColor(raw) {
    return parseColor(raw) || defaultColor;
  }

  function start(job) {
    var requested = resolveFont(job.fontName);
    var font = fontFor(requested, job.message);
    var laid = layout(job.message, font);
    if (!laid) {
      var skipped = queue.shift();
      if (skipped) start(skipped);
      return;
    }
    clearTimers();
    run += 1;
    current = {
      message: job.message,
      font: font,
      color: job.color,
      holdMs: job.holdMs,
      scrollMs: job.scrollMs,
      laid: laid,
      holdArmed: false
    };
    offset = 0;
    state = reduce || scanMs === 0 ? "hold" : "scan";
    current.scanT0 = performance.now();
    if (state === "hold") armHold();
    if (live) live.textContent = job.message;
    renderHud();
    ensureLoop();
  }

  function armHold() {
    if (!current || current.holdArmed) return;
    current.holdArmed = true;
    var my = run;
    holdTimer = setTimeout(function () {
      if (my !== run) return;
      if (reduce) finish();
      else startScroll(my);
    }, current.holdMs);
  }

  function startScroll(my) {
    if (my !== run || !current) return;
    state = "scroll";
    offset = 0;
    scrollTimer = setInterval(function () {
      if (my !== run || !current) return;
      offset += 1;
      if (offset >= ROWS || !contentFrom(offset)) {
        clearInterval(scrollTimer);
        scrollTimer = 0;
        endTimer = setTimeout(function () {
          if (my !== run) return;
          finish();
        }, current.scrollMs);
      }
    }, current.scrollMs);
  }

  function finish() {
    clearTimers();
    run += 1;
    current = null;
    state = "idle";
    offset = 0;
    renderHud();
    if (queue.length) {
      endTimer = setTimeout(function () {
        endTimer = 0;
        var next = queue.shift();
        if (next) start(next);
        else if (live) live.textContent = "";
      }, 280);
    } else if (live) {
      live.textContent = "";
    }
  }

  function dismiss() {
    run += 1;
    queue.length = 0;
    clearTimers();
    current = null;
    state = "idle";
    offset = 0;
    if (live) live.textContent = "";
    clearCanvas();
    renderHud();
  }

  function scanExact(now) {
    if (!current) return 0;
    var rows = current.laid.artBottom - current.laid.artTop + 1;
    var total = Math.max(0, rows) * COLS;
    if (scanMs <= 0 || reduce) return total;
    var elapsed = now - current.scanT0;
    return Math.min(total, elapsed / scanMs);
  }

  function drawFrame(now) {
    if (!current || state === "idle") {
      clearCanvas();
      return;
    }
    if (!fit()) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.translate(offsetX, offsetY);
    ctx.font = fontSize + "px Consolas, 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    var color = current.color;
    var font = current.font;
    var laid = current.laid;
    var buf = laid.buf;
    if (panel) drawPanel(color);

    var exact = 0;
    var total = (laid.artBottom - laid.artTop + 1) * COLS;
    if (state === "scan") {
      exact = scanExact(now);
      if (exact >= total) {
        state = "hold";
        armHold();
      }
    }

    for (var y = 0; y < ROWS; y++) {
      var srcY = y + (state === "scroll" ? offset : 0);
      var line = srcY >= 0 && srcY < ROWS ? buf[srcY] : "";
      if (!line) continue;
      for (var x = 0; x < COLS; x++) {
        var ch = line.charAt(x);
        if (!ch || ch === " ") continue;
        if (state === "scan") {
          var index = (srcY - laid.artTop) * COLS + x;
          if (srcY < laid.artTop || srcY > laid.artBottom || index >= Math.floor(exact)) continue;
          var age = exact - index;
          var paint = age < 2 ? mixWhite(color, (1 - age / 2) * 0.7) : color;
          if (font.draw === "cell") drawCell(x, y, paint);
          else drawGlyph(ch, x, y, paint);
        } else if (font.draw === "cell") {
          drawCell(x, y, color);
        } else {
          drawGlyph(ch, x, y, color);
        }
      }
    }

    if (state === "scan" && exact < total) {
      var gy = laid.artTop + Math.floor(exact / COLS);
      var gx = exact - Math.floor(exact / COLS) * COLS;
      if (gy <= laid.artBottom) drawCursor(gx, gy, mixWhite(color, 0.25));
    } else if (state === "hold" && blinkOn(now)) {
      drawCursor(laid.cursorHome.x, laid.cursorHome.y, color);
    } else if (state === "scroll") {
      drawCursor(0, ROWS - 1, color);
    }
  }

  function ensureLoop() {
    if (looping) return;
    looping = true;
    requestAnimationFrame(tick);
  }

  function tick(now) {
    if (state === "idle") {
      looping = false;
      clearCanvas();
      return;
    }
    drawFrame(now);
    requestAnimationFrame(tick);
  }

  function nextSample() {
    var sample = SAMPLES[sampleIndex % SAMPLES.length];
    sampleIndex += 1;
    enqueue({ message: sample.message, font: sample.font, color: sample.color });
  }

  function dumpFont(name) {
    var font = resolveFont(name);
    var lines = [];
    for (var i = 0; i < REQUIRED.length; i++) {
      var ch = REQUIRED.charAt(i);
      var rows = font.rows[ch];
      lines.push(ch);
      if (!rows) lines.push("(missing)");
      else rows.forEach(function (row) { lines.push(row); });
      lines.push("");
    }
    return lines.join("\n");
  }

  function handleCustom(payload) {
    if (debug) console.log("General.Custom", payload);
    var data = payload && Object.prototype.hasOwnProperty.call(payload, "data") ? payload.data : payload;
    if (typeof data === "string") {
      var trimmed = data.trim();
      if (!trimmed) return;
      try { data = JSON.parse(trimmed); }
      catch (e) { data = { event: trimmed }; }
    }
    if (!data || typeof data !== "object") return;
    if (data.data && data.event == null && typeof data.data === "object") data = data.data;
    var norm = {};
    Object.keys(data).forEach(function (k) { norm[String(k).toLowerCase()] = data[k]; });
    var eventName = String(norm.event || norm.name || "").toLowerCase();
    if (eventName !== "ascii" && eventName !== "ascii-alert" && eventName !== "terminal") return;
    var action = String(norm.action || "").toLowerCase();
    if (action === "dismiss" || action === "hide" || action === "clear") {
      dismiss();
      return;
    }
    var message = norm.message != null ? norm.message : (norm.text != null ? norm.text : norm.msg);
    if (message == null || String(message).trim() === "") return;
    var hold = norm.hold != null ? parseFloat(norm.hold) : null;
    enqueue({
      message: String(message),
      font: norm.font != null ? String(norm.font) : defaultFontName,
      color: norm.color != null ? norm.color : (norm.colour != null ? norm.colour : (norm.fg != null ? norm.fg : defaultColor)),
      hold: isFinite(hold) ? hold : null
    });
  }

  function wsUrl() {
    var path = endpoint.charAt(0) === "/" ? endpoint : "/" + endpoint;
    return "ws://" + host + ":" + port + path;
  }

  function connectRaw() {
    var retry = 0;
    function open() {
      var ws;
      try { ws = new WebSocket(wsUrl()); }
      catch (err) {
        setConnection("error");
        return;
      }
      ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.authentication) {
          if (msg.authentication.required) {
            setConnection("auth");
            try { ws.close(); } catch (e2) { /* ignore */ }
            return;
          }
          ws.send(JSON.stringify({
            request: "Subscribe",
            id: "ascii-sub",
            events: { General: ["Custom"] }
          }));
          setConnection("connected");
          retry = 0;
          return;
        }
        if (msg.event && msg.event.source === "General" && msg.event.type === "Custom") handleCustom(msg);
      };
      ws.onclose = function () {
        if (connection !== "auth") setConnection("disconnected");
        retry = Math.min(retry + 1, 8);
        setTimeout(open, Math.min(1000 * retry, 8000));
      };
      ws.onerror = function () { setConnection("error"); };
    }
    open();
  }

  function connectOfficial() {
    var options = {
      host: host,
      port: port,
      endpoint: endpoint,
      immediate: true,
      autoReconnect: true,
      onConnect: function () { setConnection("connected"); },
      onDisconnect: function () { setConnection("disconnected"); },
      onError: function () { setConnection("error"); }
    };
    if (password) options.password = password;
    var client = new window.StreamerbotClient(options);
    client.on("General.Custom", handleCustom);
  }

  function connect() {
    if (socketStarted) return;
    if (window.StreamerbotClient) {
      socketStarted = true;
      try {
        connectOfficial();
        return;
      } catch (err) {
        socketStarted = false;
        if (debug) console.error(err);
      }
    }
    if (password && !clientFailed) return;
    socketStarted = true;
    if (password) {
      setConnection("missing");
      return;
    }
    connectRaw();
  }

  function loadClient() {
    var script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/@streamerbot/client@1/dist/streamerbot-client.js";
    script.async = true;
    script.onload = function () { connect(); };
    script.onerror = function () {
      clientFailed = true;
      connect();
    };
    document.head.appendChild(script);
    setTimeout(function () { connect(); }, 3500);
  }

  if (preview) {
    window.addEventListener("keydown", function (e) {
      if (e.repeat) return;
      if (e.key === "Escape") {
        dismiss();
        return;
      }
      if (e.key === " " || e.key === "Enter" || e.code === "Space") {
        e.preventDefault();
        nextSample();
      }
    });
    document.addEventListener("click", function () { nextSample(); });
  }

  window.showAscii = function (message, font, color) {
    enqueue({ message: message, font: font, color: color });
  };
  window.dismissAscii = dismiss;
  window.__ascii = {
    show: enqueue,
    dismiss: dismiss,
    handle: handleCustom,
    phase: function () { return state; },
    errors: function () { return glyphErrors.slice(); },
    dump: dumpFont,
    buffer: function () { return current ? current.laid.buf.join("\n") : ""; },
    queue: function () { return queue.length; },
    font: function () { return current ? current.font.name + ":" + current.font.fill + ":" + current.font.draw : ""; }
  };

  renderHud();
  loadClient();
  if (urlMessage) {
    enqueue({
      message: urlMessage,
      font: defaultFontName,
      color: defaultColor
    });
  } else if (auto) {
    nextSample();
  }
})();
</script>
</body>
</html>
